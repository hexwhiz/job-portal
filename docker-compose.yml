services:
  gateway:
    image: nginx:1.27-alpine
    container_name: jp_gateway
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth
      - utils
      - user
      - job
      - payment
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: jp_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobportal}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: jp_redis
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    container_name: jp_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    expose:
      - "9092"
      - "9093"
    restart: unless-stopped

  utils:
    build: ./services/utils
    container_name: jp_utils
    env_file:
      - ./infra/env/utils.env
    depends_on:
      - kafka
    expose:
      - "5001"
    restart: unless-stopped

  auth:
    build: ./services/auth
    container_name: jp_auth
    env_file:
      - ./infra/env/auth.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      utils:
        condition: service_started
    expose:
      - "5010"
    restart: unless-stopped

  user:
    build: ./services/user
    container_name: jp_user
    env_file:
      - ./infra/env/user.env
    depends_on:
      postgres:
        condition: service_healthy
      utils:
        condition: service_started
    expose:
      - "5002"
    restart: unless-stopped

  job:
    build: ./services/job
    container_name: jp_job
    env_file:
      - ./infra/env/job.env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      utils:
        condition: service_started
    expose:
      - "5003"
    restart: unless-stopped

  payment:
    build: ./services/payment
    container_name: jp_payment
    env_file:
      - ./infra/env/payment.env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "5004"
    restart: unless-stopped

volumes:
  postgres_data:
