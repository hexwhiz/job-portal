services:
  gateway:
    image: nginx:1.27-alpine
    container_name: jp_gateway
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth
      - utils
      - user
      - job
      - payment
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: jp_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobportal}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: jp_redis
    expose:
      - "6379"
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.7
    container_name: jp_kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    expose:
      - "9092"
    restart: unless-stopped

  utils:
    build: ./services/utils
    container_name: jp_utils
    env_file:
      - ./infra/env/utils.env
    depends_on:
      - kafka
    expose:
      - "5001"
    restart: unless-stopped

  auth:
    build: ./services/auth
    container_name: jp_auth
    env_file:
      - ./infra/env/auth.env
    depends_on:
      - postgres
      - redis
      - kafka
      - utils
    expose:
      - "5000"
    restart: unless-stopped

  user:
    build: ./services/user
    container_name: jp_user
    env_file:
      - ./infra/env/user.env
    depends_on:
      - postgres
      - utils
    expose:
      - "5002"
    restart: unless-stopped

  job:
    build: ./services/job
    container_name: jp_job
    env_file:
      - ./infra/env/job.env
    depends_on:
      - postgres
      - kafka
      - utils
    expose:
      - "5003"
    restart: unless-stopped

  payment:
    build: ./services/payment
    container_name: jp_payment
    env_file:
      - ./infra/env/payment.env
    depends_on:
      - postgres
    expose:
      - "5004"
    restart: unless-stopped

volumes:
  postgres_data:
